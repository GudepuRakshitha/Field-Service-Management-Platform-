version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: keystone-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-keystone}
      POSTGRES_USER: ${DB_USER:-keystone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-keystone123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-keystone} -d ${DB_NAME:-keystone}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: keystone-mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keystone-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-keystone}
      DB_USER: ${DB_USER:-keystone}
      DB_PASSWORD: ${DB_PASSWORD:-keystone123}
      KEYSTONE_JWT_SECRET: ${KEYSTONE_JWT_SECRET:-v9y$B&E)H@MbQeThWmZq4t7w!z%C*F-JaNdRfUjXn2r5u8x/A?D(G+KbPeShVkYp}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keystone-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
